name: Check marketplace

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-marketplace.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-marketplace.yml"
  # Weekly: a tag moved in a plugin repo after the pin was written changes no file here.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (offline fixtures)
        run: bash tests/check_marketplace_pins_test.sh
      - name: Every entry pins a tag whose commit and plugin.json version match
        run: |
          rc=0
          bash scripts/check_marketplace_pins.sh || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error title=Pin failure::a marketplace pin does not match its plugin repository; fix .claude-plugin/marketplace.json" ;;
            2) echo "::error title=Network or tooling error::GitHub could not be reached or a tool is missing; no pin failure was found; rerun the job" ;;
            *) echo "::error title=Unexpected exit::check_marketplace_pins.sh exited $rc" ;;
          esac
          exit "$rc"
